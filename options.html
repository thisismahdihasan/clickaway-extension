<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ClickAway: Backup &amp; Restore</title>
<style>
  :root { --ink:#263428; --lime:#d6f078; --paper:#fbfcf7; --line:#d9ddd2; --muted:#6b7468; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { background:var(--ink); color:#fff; padding:22px 0; }
  .wrap { max-width:640px; margin:0 auto; padding:0 20px; }
  h1 { margin:0; font-size:22px; }
  header p { margin:4px 0 0; color:#c9d3c4; font-size:14px; }
  section { margin:26px 0; padding:20px; background:#fff; border:1.5px solid var(--line); border-radius:12px; }
  h2 { margin:0 0 6px; font-size:17px; }
  p.sub { margin:0 0 14px; color:var(--muted); font-size:14px; }
  button, .filebtn { display:inline-block; padding:10px 16px; border-radius:8px; border:1.5px solid var(--ink);
           background:var(--ink); color:#fff; font:600 14px "Segoe UI", system-ui, sans-serif; cursor:pointer; }
  button.ghost, .filebtn { background:transparent; color:var(--ink); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button:focus-visible, .filebtn:focus-within { outline:3px solid var(--lime); outline-offset:2px; }
  .filebtn input { position:absolute; opacity:0; width:1px; height:1px; }
  ul { margin:10px 0 0; padding-left:18px; font-size:14px; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  [hidden] { display:none !important; }
  #status { margin-top:12px; font-size:14px; min-height:20px; }
  .ok { color:#2f6b35; } .err { color:#9b1c1c; }
</style>
</head>
<body>
  <header><div class="wrap">
    <h1>ClickAway: Backup &amp; Restore</h1>
    <p>Save your products, sizes, prices and variants to a file, or load them back.</p>
  </div></header>
  <main class="wrap">
    <section>
      <h2>Export Backup</h2>
      <p class="sub" id="summary">Loading…</p>
      <button id="export">Download Backup File</button>
    </section>

    <section>
      <h2>Restore From File</h2>
      <p class="sub">Choose a backup file you downloaded before.</p>
      <label class="filebtn">Choose File<input type="file" id="file" accept=".json,application/json"></label>
      <div id="preview"></div>
      <div class="actions" id="importActions" hidden>
        <button id="merge">Add To My Products</button>
        <button id="replace" class="ghost">Replace Everything</button>
      </div>
      <div id="status"></div>
    </section>
  </main>
  <footer class="wrap" style="text-align:center;color:var(--muted);font-size:13px;padding-bottom:28px">Made with <span style="color: #E53935;">♥</span> by <b style="color:var(--ink)">ClickAway</b></footer>
  <script src="options.js"></script>
</body>
</html>
